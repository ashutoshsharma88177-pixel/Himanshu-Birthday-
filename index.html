
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Birthday Himanshu 🎂</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  font-family: Arial, sans-serif;
  background: linear-gradient(135deg, #16002c, #41106b, #09051c);
  color: white;
  overflow: hidden;
}

.card {
  width: 90%;
  max-width: 390px;
  padding: 35px 22px;
  text-align: center;
  border-radius: 25px;
  background: rgba(255,255,255,0.10);
  border: 1px solid rgba(255,255,255,0.3);
  box-shadow: 0 0 40px #c026ff55;
  backdrop-filter: blur(12px);
  animation: appear 1s ease;
  z-index: 2;
}

.cake {
  font-size: 75px;
  animation: bounce 1.5s infinite;
}

h1 {
  margin: 18px 0;
  color: #ffd166;
  font-size: 30px;
  text-shadow: 0 0 15px #ffb703;
}

h2 {
  color: #ff8fab;
  font-size: 25px;
  margin-bottom: 15px;
}

p {
  line-height: 1.7;
  font-size: 16px;
  color: #f4eaff;
}

button {
  margin-top: 25px;
  padding: 13px 23px;
  border: none;
  border-radius: 30px;
  background: linear-gradient(45deg, #ff4d8d, #ffbd59);
  color: #24002e;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
}

button:hover {
  transform: scale(1.06);
}

#extra {
  display: none;
  margin-top: 18px;
  color: #ffe29a;
}

.balloon {
  position: absolute;
  bottom: -120px;
  font-size: 45px;
  animation: float 8s linear infinite;
  z-index: 1;
}

.balloon:nth-child(2) { left: 10%; animation-delay: 1s; }
.balloon:nth-child(3) { left: 80%; animation-delay: 3s; }
.balloon:nth-child(4) { left: 30%; animation-delay: 5s; }
.balloon:nth-child(5) { left: 65%; animation-delay: 2s; }

@keyframes float {
  to { transform: translateY(-120vh) rotate(20deg); }
}

@keyframes bounce {
  50% { transform: translateY(-10px) rotate(4deg); }
}

@keyframes appear {
  from { opacity: 0; transform: scale(.7); }
  to { opacity: 1; transform: scale(1); }
}
</style>
</head>

<body>

<div class="balloon">🎈</div>
<div class="balloon">🎈</div>
<div class="balloon">🎈</div>
<div class="balloon">🎈</div>

<div class="card">
  <div class="cake">🎂</div>
  <h1>Happy Birthday!</h1>
  <h2>🎉 Himanshu 🎉</h2>

  <p>
    May your birthday bring you endless happiness,
    lots of success, beautiful memories,
    and all the things your heart wishes for.
  </p>

  <button onclick="showWish()">
    Open Your Surprise 🎁
  </button>

  <div id="extra">
    <h2>🥳 Stay Blessed! 🥳</h2>
    <p>
      Keep smiling, keep shining,
      and make every moment count! ✨
      <br><br>
      Lots of love & best wishes! ❤️
    </p>
  </div>
</div>

<script>
function showWish() {
  document.getElementById("extra").style.display = "block";
  document.querySelector("button").textContent =
    "Happy Birthday Himanshu ❤️";
}
</script>

</body>
</html>
